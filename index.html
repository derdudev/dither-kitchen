<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dither Kitchen</title>
    
    <style>
        canvas{
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <canvas id="view"></canvas>
    <br/>
    <input
            id="image-upload"
        type="file"
        onchange="upload()"
        accept="image/*"
    />
    <br/>
    <input id="scale-slider" type="range" min="0" max="1" step="0.05"  value="0.5" disabled/>
    <br/>
    <input id="threshold-slider" type="range" min="0" max="255" step="1"  value="64" disabled/>
    <script src="dither.js"></script>
</body>
</html>
